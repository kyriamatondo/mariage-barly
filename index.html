<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barly & Priscille | Invitation</title>
<!-- Aperçu WhatsApp : modifie ces 3 lignes -->
<meta property="og:title" content="Barly & Priscille, notre mariage">
<meta property="og:description" content="Vous êtes invités. Confirmez votre présence en un clic.">
<meta property="og:image" content="images/photo1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root{--red:#e5252a;--ink:#000;--panel:#0c0c0c;--ivory:#f4efe9;--gold:#c9a96e;--mute:rgba(244,239,233,.72);--line:rgba(201,169,110,.5)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:'Jost',sans-serif;font-weight:300;overflow-x:hidden}
h1,h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;margin:0}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:4px}
section[id]{scroll-margin-top:4.5rem}

/* NAVBAR */
.nav-top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,3rem);transition:background .4s,padding .4s,border-color .4s;border-bottom:1px solid transparent}
.nav-top.solid{background:rgba(0,0,0,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:.7rem;padding-bottom:.7rem;border-color:var(--line)}
.logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.7rem;color:var(--ivory);text-decoration:none;line-height:1}
.logo i{color:var(--red)}
.links{display:flex;gap:2rem}
.links a{color:var(--ivory);text-decoration:none;font-size:1rem;position:relative;padding:.3rem 0}
.links a::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .3s}
.links a:hover::after{width:100%}
.nav-cta{padding:.7rem 1.4rem;border-radius:999px;background:var(--red);color:#fff;font:500 .95rem 'Jost',sans-serif;text-decoration:none;white-space:nowrap;animation:pulse 2.6s infinite;transition:background .3s,color .3s}
.nav-cta:hover{background:var(--ivory);color:var(--ink)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,37,42,.65)}70%{box-shadow:0 0 0 14px rgba(229,37,42,0)}100%{box-shadow:0 0 0 0 rgba(229,37,42,0)}}
@media(prefers-reduced-motion:reduce){.nav-cta{animation:none}}

/* HERO */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 1.5rem 3.5rem;overflow:hidden;
background:radial-gradient(ellipse 70% 45% at 50% 105%,rgba(229,37,42,.38),transparent 70%),var(--ink)}
.hero::after{content:'';position:absolute;inset:clamp(10px,2vw,22px);border:1px solid rgba(201,169,110,.35);pointer-events:none}
.orn{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--gold);margin-bottom:1.4rem}
.orn::before,.orn::after{content:'';width:54px;height:1px;background:var(--gold)}
.orn span{font-size:.6rem}
.invite{font-size:1.05rem;letter-spacing:.1em;color:var(--mute);margin:0 0 1.2rem}
h1{font-size:clamp(4.2rem,19vw,10.5rem);line-height:.88}
h1 .amp{display:block;font-size:.55em;line-height:.8;color:var(--red);margin:.05em 0 .1em;text-shadow:0 0 50px rgba(229,37,42,.55)}
.cta{display:inline-block;padding:1.15rem 2.6rem;border-radius:999px;background:var(--red);color:#fff;font:500 1.02rem 'Jost',sans-serif;text-decoration:none;box-shadow:0 0 45px rgba(229,37,42,.5);transition:transform .3s,background .3s,color .3s}
.cta:hover{transform:translateY(-3px);background:var(--ivory);color:var(--ink)}
.hero .cta{margin-top:2.8rem}
.info{display:grid;grid-template-columns:repeat(3,1fr);max-width:680px;width:100%;margin-top:3.2rem}
.info div{padding:0 1rem}
.info div+div{border-left:1px solid var(--line)}
.info small{display:block;font-size:.88rem;color:var(--gold);margin-bottom:.4rem}
.info b{font-weight:500;font-size:1.02rem;line-height:1.35}

/* TENUE */
.tenue{padding:6.5rem 1.5rem;text-align:center;background:var(--ink)}
.tenue h2{font-size:clamp(2.2rem,7vw,3.4rem)}
.sw{display:flex;justify-content:center;gap:2.2rem;margin:2.4rem 0 1.8rem}
.sw div{display:grid;gap:.8rem;justify-items:center;font-size:.95rem;color:var(--mute)}
.sw i{display:block;width:68px;height:68px;border-radius:50%;border:1px solid var(--gold)}
.sw .k{background:#000;box-shadow:inset 0 0 0 5px #000,inset 0 0 0 6px rgba(201,169,110,.5)}
.sw .r{background:var(--red)}
.sw .g{background:var(--gold)}
.tenue p{max-width:34ch;margin:0 auto;font-size:1.05rem;line-height:1.6;color:var(--mute)}

/* CARROUSEL */
.gallery{padding:7rem 1.5rem 6rem;text-align:center;background:linear-gradient(var(--ink),var(--panel) 30%,var(--panel))}
.gallery h2{font-size:clamp(2.4rem,8vw,3.8rem);margin-bottom:3rem}
.stage{position:relative;width:min(80vw,430px);margin:0 auto}
.stage::before{content:'';position:absolute;inset:0;border:1px solid var(--red);transform:translate(16px,16px);pointer-events:none}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#150506;touch-action:pan-y;cursor:grab}
.frame::after{content:'';position:absolute;inset:10px;border:1px solid rgba(201,169,110,.6);pointer-events:none;z-index:2}
.slide{position:absolute;inset:0;opacity:0;background:linear-gradient(160deg,#1b0709,#050000)}
.slide img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.slide:first-child{opacity:1}
.nav{display:flex;align-items:center;justify-content:center;gap:1.6rem;margin-top:3.2rem}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--red);background:transparent;color:var(--ivory);font-size:1.3rem;cursor:pointer;transition:background .3s}
.nav button:hover{background:var(--red)}
.dots{display:flex;gap:.55rem}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--red);background:transparent}
.dots button.on{background:var(--red);width:26px;border-radius:9px}
.count{margin:1.4rem 0 0;color:var(--mute);font-size:.95rem}

/* FIN */
.end{padding:1rem 1.5rem 5.5rem;text-align:center;background:var(--panel)}
.end p{margin:0 0 1.6rem;font-size:1.05rem;color:var(--mute)}
.foot{padding:3rem 1.5rem 3.5rem;text-align:center;background:var(--ink);border-top:1px solid var(--line)}
.foot h2{font-size:2.4rem}
.foot h2 i{color:var(--red)}
.foot p{margin:.8rem 0 0;color:var(--gold);font-size:1rem}

@media(max-width:640px){.links{display:none}.nav-cta{padding:.6rem 1.1rem;font-size:.88rem}}
@media(max-width:480px){.info{grid-template-columns:1fr;gap:1.3rem}.info div+div{border-left:0;border-top:1px solid var(--line);padding-top:1.3rem}.stage::before{transform:translate(10px,10px)}.sw{gap:1.3rem}.sw i{width:56px;height:56px}}
</style>
</head>
<body id="top">

<header class="nav-top" id="nav">
  <a class="logo" href="#top" aria-label="Haut de page">B <i>&amp;</i> P</a>
  <nav class="links" aria-label="Navigation">
    <a href="#infos">Infos</a>
    <a href="#tenue">Tenue</a>
    <a href="#photos">Photos</a>
  </nav>
  <a class="nav-cta" id="cta0" href="#"></a>
</header>

<section class="hero" id="infos">
  <div class="orn"><span>&#9670;</span></div>
  <p class="invite">Vous êtes invités au mariage de</p>
  <h1><span id="n1"></span><span class="amp">&amp;</span><span id="n2"></span></h1>
  <a class="cta" id="cta" href="#"></a>
  <div class="info">
    <div><small>Date</small><b id="date"></b></div>
    <div><small>Lieu</small><b id="venue"></b></div>
    <div><small>Tenue</small><b id="dress"></b></div>
  </div>
</section>

<section class="tenue" id="tenue">
  <h2 id="dtitle"></h2>
  <div class="sw">
    <div><i class="k"></i>Noir</div>
    <div><i class="r"></i>Rouge</div>
    <div><i class="g"></i>Champagne</div>
  </div>
  <p id="dnote"></p>
</section>

<section class="gallery" id="photos">
  <h2 id="gtitle"></h2>
  <div class="stage"><div class="frame" id="frame" aria-roledescription="carrousel"></div></div>
  <div class="nav">
    <button id="prev" aria-label="Photo précédente">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Photo suivante">&#8594;</button>
  </div>
  <p class="count" id="count"></p>
</section>

<section class="end">
  <p>On compte sur votre présence.</p>
  <a class="cta" id="cta2" href="#"></a>
</section>

<footer class="foot">
  <h2><span id="f1"></span> <i>&amp;</i> <span id="f2"></span></h2>
  <p id="fdate"></p>
</footer>

<script src="index.js"></script>
</body>
</html>
